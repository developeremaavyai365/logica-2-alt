version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logica
      POSTGRES_PASSWORD: logica_dev_password
      POSTGRES_DB: logica
    ports:
      - "5432:5432"
    volumes:
      - logica_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  logica_postgres_data:
